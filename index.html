<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur de Couverture AV - Room Visualizer</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (v18 UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }
    
    .canvas-container {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- PRESETS SYSTEM ---
    const PRESETS = [
      {
        id: 'owl3',
        name: 'Meeting Owl 3',
        category: '360° Central',
        description: 'Caméra et haut-parleur 360° tout-en-un pour salles de taille moyenne.',
        resolution: '1080p Full HD (360°)',
        daisyChain: "Sans fil via Owl Connect (jusqu'à 2 unités)",
        autonomyOS: 'Système autonome Owl Intelligence System (OIS)',
        devices: [
          { id: 'dev-1', name: 'Meeting Owl 3', type: 'center360', videoRadius: 3.0, audioRadius: 5.5, offsetX: 0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'dual_owl3',
        name: 'Dual Meeting Owl 3',
        category: '360° Double',
        description: 'Deux unités Owl 3 appairées sans fil pour une extension de couverture.',
        resolution: '1080p Full HD (Chaque unité)',
        daisyChain: 'Appairage sans fil Owl Connect (portée max 8m entre unités)',
        autonomyOS: 'Commutation intelligente de caméra automatique',
        devices: [
          { id: 'dev-1', name: 'Owl 3 (Principal)', type: 'center360', videoRadius: 3.0, audioRadius: 5.5, offsetX: -2.0, offsetY: 0, fov: 360 },
          { id: 'dev-2', name: 'Owl 3 (Secondaire)', type: 'center360', videoRadius: 3.0, audioRadius: 5.5, offsetX: 2.0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'kandao_pro',
        name: 'Kandao Meeting Pro',
        category: '360° Central',
        description: 'Caméra 360° avec système Android intégré et haut-parleurs Hi-Fi.',
        resolution: '1080p (Enregistrement 4K)',
        daisyChain: 'Non supporté',
        autonomyOS: 'Android OS intégré (Mode Autonome ou USB PC)',
        devices: [
          { id: 'dev-1', name: 'Kandao Meeting Pro', type: 'center360', videoRadius: 3.2, audioRadius: 5.5, offsetX: 0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'kandao_ultra',
        name: 'Kandao Meeting Ultra',
        category: '360° Central',
        description: 'Caméra 360° premium avec deux écrans tactiles HD et vidéo 4K HDR.',
        resolution: '4K HDR 60fps (360°)',
        daisyChain: 'Chaînable USB-C / IP',
        autonomyOS: 'Android OS autonome avec double écran tactile',
        devices: [
          { id: 'dev-1', name: 'Kandao Meeting Ultra', type: 'center360', videoRadius: 3.8, audioRadius: 5.5, offsetX: 0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'dual_kandao',
        name: 'Dual Kandao Chaîné USB',
        category: '360° Double',
        description: 'Deux boîtiers Kandao reliés par câble USB pour très grandes tables.',
        resolution: '4K HDR (Double vue)',
        daisyChain: 'Filaire USB-C Maître/Esclave',
        autonomyOS: 'Mode PC / BYOD via hub USB',
        devices: [
          { id: 'dev-1', name: 'Kandao Ultra (A)', type: 'center360', videoRadius: 3.8, audioRadius: 5.5, offsetX: -2.5, offsetY: 0, fov: 360 },
          { id: 'dev-2', name: 'Kandao Ultra (B)', type: 'center360', videoRadius: 3.8, audioRadius: 5.5, offsetX: 2.5, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'logi_sight_rally',
        name: 'Logitech Sight + Rally Bar',
        category: 'Hybride Mur Droit + Table 360°',
        description: "Combinaison d'une barre vidéo sur le mur droit et d'une caméra de table 360°.",
        resolution: '4K Ultra-HD (Rally Bar) + 4K (Sight)',
        daisyChain: 'Connexion Directe IP / Ethernet à la Rally Bar',
        autonomyOS: 'CollabOS (Zoom Rooms, MS Teams Rooms, Mode BYOD)',
        devices: [
          { id: 'dev-1', name: 'Logitech Sight (Table)', type: 'center360', videoRadius: 2.3, audioRadius: 3.5, offsetX: 0, offsetY: 0, fov: 360 },
          { id: 'dev-2', name: 'Rally Bar (Mur Droit)', type: 'frontBar', videoRadius: 7.0, audioRadius: 7.0, offsetX: 5.8, offsetY: 0, fov: 120, angle: 180 }
        ]
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Room Settings State
      const [roomLength, setRoomLength] = useState(13);
      const [roomWidth, setRoomWidth] = useState(9);

      // Table Settings State (Real Layout: 3x1.80m side legs + 2x1.20m base/ends + rounded corners = 6.2m x 4.0m)
      const [tableShape, setTableShape] = useState('U_SHAPE');
      const [tableLength, setTableLength] = useState(6.2);
      const [tableWidth, setTableWidth] = useState(4.0);
      const [tableDepth, setTableDepth] = useState(0.8);
      const [seatCount, setSeatCount] = useState(20); // Default to 20 seats
      const [tablePos, setTablePos] = useState({ x: 0, y: 0 });

      // Equipment State
      const [selectedPresetId, setSelectedPresetId] = useState('owl3');
      const [activeDevices, setActiveDevices] = useState(PRESETS[0].devices);

      // Canvas Interaction State
      const [zoom, setZoom] = useState(0.7);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [showGrid, setShowGrid] = useState(true);
      const [showVideoZone, setShowVideoZone] = useState(true);
      const [showAudioZone, setShowAudioZone] = useState(true);

      // Handle Preset Change
      const handleSelectPreset = (presetId) => {
        setSelectedPresetId(presetId);
        const preset = PRESETS.find(p => p.id === presetId);
        if (preset) {
          setActiveDevices(preset.devices.map(d => ({ ...d })));
        }
      };

      // Reset Table & Cameras to Center
      const handleResetLayout = () => {
        setTablePos({ x: 0, y: 0 });
        const preset = PRESETS.find(p => p.id === selectedPresetId);
        if (preset) {
          setActiveDevices(preset.devices.map(d => ({ ...d })));
        }
        setZoom(0.7);
        setPan({ x: 0, y: 0 });
      };

      // Calculate Seats Positions (Uniform distribution including rounded corners)
      const seats = useMemo(() => {
        const list = [];
        const count = Math.max(2, seatCount);
        const halfL = tableLength / 2;
        const halfW = tableWidth / 2;
        const margin = 0.55;
        const cornerR = tableDepth + margin;
        const arcLen = 0.5 * Math.PI * cornerR;

        if (tableShape === 'RECTANGLE_HOLLOW') {
          // Real Modular Rectangle Fermé (4 straight sides + 4 rounded corner arcs)
          const straightL = Math.max(0.2, tableLength - 2 * tableDepth);
          const straightW = Math.max(0.2, tableWidth - 2 * tableDepth);

          const L1 = straightL;
          const L2 = arcLen;
          const L3 = straightW;
          const L4 = arcLen;
          const L5 = straightL;
          const L6 = arcLen;
          const L7 = straightW;
          const L8 = arcLen;

          const totalPerim = L1 + L2 + L3 + L4 + L5 + L6 + L7 + L8;
          const step = totalPerim / count;

          for (let i = 0; i < count; i++) {
            const dist = (i + 0.5) * step;
            let x = 0, y = 0;

            if (dist < L1) {
              // Top straight
              x = (-halfL + tableDepth) + dist;
              y = -halfW - margin;
            } else if (dist < L1 + L2) {
              // Top-Right rounded corner
              const phi = (dist - L1) / L2;
              const theta = 1.5 * Math.PI + phi * 0.5 * Math.PI;
              x = (halfL - tableDepth) + cornerR * Math.cos(theta);
              y = (-halfW + tableDepth) + cornerR * Math.sin(theta);
            } else if (dist < L1 + L2 + L3) {
              // Right straight
              const d = dist - (L1 + L2);
              x = halfL + margin;
              y = (-halfW + tableDepth) + d;
            } else if (dist < L1 + L2 + L3 + L4) {
              // Bottom-Right rounded corner
              const phi = (dist - (L1 + L2 + L3)) / L4;
              const theta = phi * 0.5 * Math.PI;
              x = (halfL - tableDepth) + cornerR * Math.cos(theta);
              y = (halfW - tableDepth) + cornerR * Math.sin(theta);
            } else if (dist < L1 + L2 + L3 + L4 + L5) {
              // Bottom straight
              const d = dist - (L1 + L2 + L3 + L4);
              x = (halfL - tableDepth) - d;
              y = halfW + margin;
            } else if (dist < L1 + L2 + L3 + L4 + L5 + L6) {
              // Bottom-Left rounded corner
              const phi = (dist - (L1 + L2 + L3 + L4 + L5)) / L6;
              const theta = 0.5 * Math.PI + phi * 0.5 * Math.PI;
              x = (-halfL + tableDepth) + cornerR * Math.cos(theta);
              y = (halfW - tableDepth) + cornerR * Math.sin(theta);
            } else if (dist < L1 + L2 + L3 + L4 + L5 + L6 + L7) {
              // Left straight
              const d = dist - (L1 + L2 + L3 + L4 + L5 + L6);
              x = -halfL - margin;
              y = (halfW - tableDepth) - d;
            } else {
              // Top-Left rounded corner
              const phi = (dist - (L1 + L2 + L3 + L4 + L5 + L6 + L7)) / L8;
              const theta = Math.PI + phi * 0.5 * Math.PI;
              x = (-halfL + tableDepth) + cornerR * Math.cos(theta);
              y = (-halfW + tableDepth) + cornerR * Math.sin(theta);
            }
            list.push({ id: i + 1, x: x + tablePos.x, y: y + tablePos.y });
          }
        } else if (tableShape === 'U_SHAPE') {
          // Real Modular U-Shape Geometry (3 straight legs + 2 rounded corner arcs)
          const straightL = Math.max(0.2, tableLength - tableDepth);
          const straightW = Math.max(0.2, tableWidth - 2 * tableDepth);

          const L1 = straightL;
          const L2 = arcLen;
          const L3 = straightW;
          const L4 = arcLen;
          const L5 = straightL;

          const totalPerim = L1 + L2 + L3 + L4 + L5;
          const step = totalPerim / count;

          for (let i = 0; i < count; i++) {
            const dist = (i + 0.5) * step;
            let x = 0, y = 0;

            if (dist < L1) {
              // Top leg straight
              x = (-halfL + tableDepth) + dist;
              y = -halfW - margin;
            } else if (dist < L1 + L2) {
              // Top-Left rounded corner arc
              const phi = (dist - L1) / L2;
              const theta = 1.5 * Math.PI - phi * 0.5 * Math.PI;
              x = (-halfL + tableDepth) + cornerR * Math.cos(theta);
              y = (-halfW + tableDepth) + cornerR * Math.sin(theta);
            } else if (dist < L1 + L2 + L3) {
              // Left base leg straight
              const d = dist - (L1 + L2);
              x = -halfL - margin;
              y = (-halfW + tableDepth) + d;
            } else if (dist < L1 + L2 + L3 + L4) {
              // Bottom-Left rounded corner arc
              const phi = (dist - (L1 + L2 + L3)) / L4;
              const theta = Math.PI - phi * 0.5 * Math.PI;
              x = (-halfL + tableDepth) + cornerR * Math.cos(theta);
              y = (halfW - tableDepth) + cornerR * Math.sin(theta);
            } else {
              // Bottom leg straight
              const d = dist - (L1 + L2 + L3 + L4);
              x = (-halfL + tableDepth) + d;
              y = halfW + margin;
            }
            list.push({ id: i + 1, x: x + tablePos.x, y: y + tablePos.y });
          }
        }

        return list;
      }, [tableShape, tableLength, tableWidth, tableDepth, seatCount, tablePos]);

      // Calculate Seat Coverage Status
      const seatStatuses = useMemo(() => {
        return seats.map(seat => {
          let hasVideo = false;
          let hasAudio = false;

          activeDevices.forEach(dev => {
            const dx = seat.x - dev.offsetX;
            const dy = seat.y - dev.offsetY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist <= dev.audioRadius) {
              hasAudio = true;
            }

            if (dev.type === 'frontBar') {
              const devAngleRad = ((dev.angle || 90) * Math.PI) / 180;
              const angleToSeat = Math.atan2(dy, dx);
              let angleDiff = Math.abs(angleToSeat - devAngleRad);
              while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
              angleDiff = Math.abs(angleDiff);

              const halfFovRad = (((dev.fov || 120) / 2) * Math.PI) / 180;

              if (dist <= dev.videoRadius && angleDiff <= halfFovRad) {
                hasVideo = true;
              }
            } else {
              if (dist <= dev.videoRadius) {
                hasVideo = true;
              }
            }
          });

          let status = 'RED';
          if (hasVideo && hasAudio) {
            status = 'GREEN';
          } else if (hasAudio) {
            status = 'ORANGE';
          }

          return {
            ...seat,
            status,
            hasVideo,
            hasAudio
          };
        });
      }, [seats, activeDevices]);

      // Summary KPIs
      const kpis = useMemo(() => {
        const total = seatStatuses.length;
        const greenCount = seatStatuses.filter(s => s.status === 'GREEN').length;
        const orangeCount = seatStatuses.filter(s => s.status === 'ORANGE').length;
        const redCount = seatStatuses.filter(s => s.status === 'RED').length;
        return { total, greenCount, orangeCount, redCount };
      }, [seatStatuses]);

      const selectedPreset = PRESETS.find(p => p.id === selectedPresetId) || PRESETS[0];

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-950 text-slate-100 font-sans">
          
          {/* SOBRE TOP NAVBAR */}
          <header className="h-14 px-5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 flex-shrink-0">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-sky-600/20 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
              </div>
              <h1 className="text-sm font-semibold text-slate-200 tracking-wide">
                Simulateur de Couverture AV & Aménagement de Salle
              </h1>
            </div>

            {/* Preset Selector */}
            <div className="flex items-center space-x-3">
              <span className="text-xs text-slate-400 font-medium">Équipement :</span>
              <select
                value={selectedPresetId}
                onChange={(e) => handleSelectPreset(e.target.value)}
                className="pl-3 pr-8 py-1.5 text-xs font-semibold rounded-lg bg-slate-800 border border-slate-700 text-slate-200 focus:outline-none focus:border-sky-500 cursor-pointer"
              >
                {PRESETS.map(p => (
                  <option key={p.id} value={p.id}>{p.name} ({p.category})</option>
                ))}
              </select>
            </div>
          </header>

          {/* MAIN WORKSPACE LAYOUT */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* LEFT SIDEBAR: CONTROLS */}
            <aside className="w-72 border-r border-slate-800/80 bg-slate-900/60 flex flex-col flex-shrink-0 z-10">
              
              <div className="flex-1 overflow-y-auto p-4 space-y-5">
                
                {/* A. ROOM PARAMETERS */}
                <div className="space-y-3">
                  <h2 className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    Dimensions de la Salle
                  </h2>

                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-slate-300">Longueur</span>
                      <span className="text-sky-400 font-semibold">{roomLength} m</span>
                    </div>
                    <input
                      type="range"
                      min="5"
                      max="25"
                      step="0.5"
                      value={roomLength}
                      onChange={(e) => setRoomLength(parseFloat(e.target.value))}
                      className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-slate-300">Largeur</span>
                      <span className="text-sky-400 font-semibold">{roomWidth} m</span>
                    </div>
                    <input
                      type="range"
                      min="4"
                      max="18"
                      step="0.5"
                      value={roomWidth}
                      onChange={(e) => setRoomWidth(parseFloat(e.target.value))}
                      className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                    />
                  </div>
                </div>

                <hr className="border-slate-800" />

                {/* B. TABLE CONFIGURATION */}
                <div className="space-y-3">
                  <h2 className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                    Configuration de la Table
                  </h2>

                  <div>
                    <label className="block text-xs text-slate-300 mb-1.5">Forme de table</label>
                    <div className="grid grid-cols-2 gap-1.5 text-xs">
                      <button
                        type="button"
                        onClick={() => setTableShape('U_SHAPE')}
                        className={`p-2.5 rounded-lg border text-center transition ${
                          tableShape === 'U_SHAPE'
                            ? 'border-sky-500 bg-sky-950/30 text-sky-300 font-semibold'
                            : 'border-slate-800 hover:bg-slate-800/50 text-slate-400'
                        }`}
                      >
                        Table en U
                      </button>

                      <button
                        type="button"
                        onClick={() => setTableShape('RECTANGLE_HOLLOW')}
                        className={`p-2.5 rounded-lg border text-center transition ${
                          tableShape === 'RECTANGLE_HOLLOW'
                            ? 'border-sky-500 bg-sky-950/30 text-sky-300 font-semibold'
                            : 'border-slate-800 hover:bg-slate-800/50 text-slate-400'
                        }`}
                      >
                        Rectangle fermé
                      </button>
                    </div>
                  </div>

                  <div className="p-2.5 rounded-lg bg-sky-950/30 border border-sky-900/40 text-[11px] text-sky-300 leading-snug">
                    <span className="font-semibold text-sky-200">Composition Modulaire :</span><br/>
                    • 3 tables de 1,80 m en longueur<br/>
                    • 2 tables de 1,20 m en largeur<br/>
                    • {tableShape === 'U_SHAPE' ? "2 raccords d'angle arrondis (U)" : "4 raccords d'angle arrondis"}
                  </div>

                  <div className="space-y-2.5">
                    <div>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-slate-300">Longueur Côtés</span>
                        <span className="text-sky-400 font-semibold">{tableLength} m</span>
                      </div>
                      <input
                        type="range"
                        min="2"
                        max="15"
                        step="0.2"
                        value={tableLength}
                        onChange={(e) => setTableLength(parseFloat(e.target.value))}
                        className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                      />
                    </div>

                    <div>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-slate-300">Largeur Base</span>
                        <span className="text-sky-400 font-semibold">{tableWidth} m</span>
                      </div>
                      <input
                        type="range"
                        min="2"
                        max="10"
                        step="0.2"
                        value={tableWidth}
                        onChange={(e) => setTableWidth(parseFloat(e.target.value))}
                        className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center text-xs mb-1">
                      <span className="text-slate-300">Participants (Sièges)</span>
                      <div className="flex items-center space-x-1">
                        <input
                          type="number"
                          min="4"
                          max="50"
                          value={seatCount}
                          onChange={(e) => setSeatCount(Math.max(2, Math.min(50, parseInt(e.target.value) || 2)))}
                          className="w-12 px-1.5 py-0.5 text-center font-bold text-sky-400 bg-slate-900 border border-slate-700 rounded text-xs focus:outline-none focus:border-sky-500"
                        />
                        <span className="text-[11px] text-slate-400">sièges</span>
                      </div>
                    </div>
                    <input
                      type="range"
                      min="4"
                      max="50"
                      step="1"
                      value={seatCount}
                      onChange={(e) => setSeatCount(parseInt(e.target.value))}
                      className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                    />
                  </div>
                </div>

              </div>

              {/* Reset Button */}
              <div className="p-3 border-t border-slate-800 bg-slate-950/40">
                <button
                  onClick={handleResetLayout}
                  className="w-full py-1.5 text-xs font-semibold rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                >
                  Réinitialiser Vue (Centrer)
                </button>
              </div>
            </aside>

            {/* CENTER CANVAS AREA */}
            <main className="flex-1 relative bg-slate-950 overflow-hidden flex flex-col">
              
              {/* Floating Overlay Controls */}
              <div className="absolute top-4 left-4 z-20 flex items-center space-x-2 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-700/80 shadow-lg text-xs">
                <button
                  onClick={() => setZoom(z => Math.min(z + 0.15, 2.5))}
                  className="hover:text-sky-400 font-bold px-1 text-sm"
                  title="Zoom Avant"
                >
                  +
                </button>
                <span className="font-mono text-xs font-bold text-slate-200">{Math.round(zoom * 100)}%</span>
                <button
                  onClick={() => setZoom(z => Math.max(z - 0.15, 0.3))}
                  className="hover:text-sky-400 font-bold px-1 text-sm"
                  title="Zoom Arrière"
                >
                  -
                </button>

                <div className="h-3.5 w-px bg-slate-700 mx-1"></div>

                <button
                  onClick={handleResetLayout}
                  className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300"
                  title="Centrer la vue"

    // --- CANVAS 2D RENDER ENGINE COMPONENT ---
    function Canvas2DEngine({
      roomLength,
      roomWidth,
      tableShape,
      tableLength,
      tableWidth,
      tableDepth,
      tablePos,
      setTablePos,
      devices,
      setDevices,
      seats,
      zoom,
      setZoom,
      pan,
      setPan,
      showGrid,
      showVideoZone,
      showAudioZone
    }) {
      const canvasRef = useRef(null);
      const isDraggingRef = useRef(false);
      const dragTargetRef = useRef(null);

      const PXM = 50 * zoom;

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, width, height);

        const centerX = width / 2 + pan.x;
        const centerY = height / 2 + pan.y;

        ctx.save();
        ctx.translate(centerX, centerY);

        // 1. METRIC GRID
        if (showGrid) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
          ctx.lineWidth = 1;

          const roomWpx = roomWidth * PXM;
          const roomLpx = roomLength * PXM;

          const startX = -roomLpx / 2;
          const endX = roomLpx / 2;
          const startY = -roomWpx / 2;
          const endY = roomWpx / 2;

          for (let x = startX; x <= endX; x += PXM) {
            ctx.beginPath();
            ctx.moveTo(x, startY);
            ctx.lineTo(x, endY);
            ctx.stroke();
          }

          for (let y = startY; y <= endY; y += PXM) {
            ctx.beginPath();
            ctx.moveTo(startX, y);
            ctx.lineTo(endX, y);
            ctx.stroke();
          }
        }

        // 2. ROOM WALLS
        const rW = roomLength * PXM;
        const rH = roomWidth * PXM;
        const roomLeft = -rW / 2;
        const roomTop = -rH / 2;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.fillRect(roomLeft, roomTop, rW, rH);

        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.strokeRect(roomLeft, roomTop, rW, rH);

        // Room Length Annotation (Top)
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${roomLength} m`, 0, roomTop - 10);

        // Room Width Annotation (Left)
        ctx.save();
        ctx.translate(roomLeft - 14, 0);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(`${roomWidth} m`, 0, 0);
        ctx.restore();

        // 3. COVERAGE ZONES
        devices.forEach(dev => {
          const devX = dev.offsetX * PXM;
          const devY = dev.offsetY * PXM;

          if (showAudioZone) {
            const effAudioR = dev.audioRadius * PXM;
            ctx.beginPath();
            ctx.arc(devX, devY, effAudioR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(245, 158, 11, 0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          if (showVideoZone) {
            const videoR = dev.videoRadius * PXM;
            ctx.beginPath();

            if (dev.type === 'frontBar') {
              const angleRad = ((dev.angle || 90) * Math.PI) / 180;
              const halfFovRad = (((dev.fov || 120) / 2) * Math.PI) / 180;
              ctx.moveTo(devX, devY);
              ctx.arc(devX, devY, videoR, angleRad - halfFovRad, angleRad + halfFovRad);
              ctx.closePath();
            } else {
              ctx.arc(devX, devY, videoR, 0, Math.PI * 2);
            }

            ctx.fillStyle = 'rgba(14, 165, 233, 0.12)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        });

        // 4. TABLE GEOMETRY
        ctx.save();
        ctx.translate(tablePos.x * PXM, tablePos.y * PXM);

        const tL = tableLength * PXM;
        const tW = tableWidth * PXM;
        const tD = tableDepth * PXM;

        ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;

        if (tableShape === 'RECTANGLE_HOLLOW') {
          // Modular Rectangle Fermé (3 tables of 1.80m on top & bottom, 2 tables of 1.20m on left & right, 4 rounded corners)
          ctx.save();

          const straightLen = Math.max(0.5, tL - 2 * tD); // 3 * 1.80m
          const segL = straightLen / 3;

          const straightW = Math.max(0.5, tW - 2 * tD); // 2 * 1.20m
          const segW = straightW / 2;

          // A. Top Side (3 Modular Tables of 1.80m)
          for (let i = 0; i < 3; i++) {
            const xStart = -tL / 2 + tD + i * segL;
            ctx.beginPath();
            ctx.rect(xStart, -tW / 2, segL, tD);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // B. Bottom Side (3 Modular Tables of 1.80m)
          for (let i = 0; i < 3; i++) {
            const xStart = -tL / 2 + tD + i * segL;
            ctx.beginPath();
            ctx.rect(xStart, tW / 2 - tD, segL, tD);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // C. Left Side (2 Modular Tables of 1.20m)
          for (let i = 0; i < 2; i++) {
            const yStart = -tW / 2 + tD + i * segW;
            ctx.beginPath();
            ctx.rect(-tL / 2, yStart, tD, segW);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // D. Right Side (2 Modular Tables of 1.20m)
          for (let i = 0; i < 2; i++) {
            const yStart = -tW / 2 + tD + i * segW;
            ctx.beginPath();
            ctx.rect(tL / 2 - tD, yStart, tD, segW);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // E. 4 Rounded Corner Connectors
          // Top-Left
          ctx.beginPath();
          ctx.arc(-tL / 2 + tD, -tW / 2 + tD, tD, Math.PI, 1.5 * Math.PI);
          ctx.lineTo(-tL / 2 + tD, -tW / 2 + tD);
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fill();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Top-Right
          ctx.beginPath();
          ctx.arc(tL / 2 - tD, -tW / 2 + tD, tD, 1.5 * Math.PI, 2 * Math.PI);
          ctx.lineTo(tL / 2 - tD, -tW / 2 + tD);
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fill();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Bottom-Right
          ctx.beginPath();
          ctx.arc(tL / 2 - tD, tW / 2 - tD, tD, 0, 0.5 * Math.PI);
          ctx.lineTo(tL / 2 - tD, tW / 2 - tD);
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fill();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Bottom-Left
          ctx.beginPath();
          ctx.arc(-tL / 2 + tD, tW / 2 - tD, tD, 0.5 * Math.PI, Math.PI);
          ctx.lineTo(-tL / 2 + tD, tW / 2 - tD);
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fill();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.restore();
        } else if (tableShape === 'U_SHAPE') {
          // Modular U-Shape Geometry with 3 tables (1.80m) per leg, 2 tables (1.20m) at base, and 2 rounded corners
          ctx.save();

          const straightLen = Math.max(0.5, tL - tD);
          const segL = straightLen / 3;

          const straightW = Math.max(0.5, tW - 2 * tD);
          const segW = straightW / 2;

          // A. Top Horizontal Leg (3 Modular Tables of 1.80m)
          for (let i = 0; i < 3; i++) {
            const xStart = -tL / 2 + tD + i * segL;
            ctx.beginPath();
            ctx.rect(xStart, -tW / 2, segL, tD);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // B. Bottom Horizontal Leg (3 Modular Tables of 1.80m)
          for (let i = 0; i < 3; i++) {
            const xStart = -tL / 2 + tD + i * segL;
            ctx.beginPath();
            ctx.rect(xStart, tW / 2 - tD, segL, tD);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // C. Rear Base Leg (2 Modular Tables of 1.20m)
          for (let i = 0; i < 2; i++) {
            const yStart = -tW / 2 + tD + i * segW;
            ctx.beginPath();
            ctx.rect(-tL / 2, yStart, tD, segW);
            ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
            ctx.fill();
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // D. Rounded Corner Connector 1 (Top-Left)
          ctx.beginPath();
          ctx.arc(-tL / 2 + tD, -tW / 2 + tD, tD, Math.PI, 1.5 * Math.PI);
          ctx.lineTo(-tL / 2 + tD, -tW / 2 + tD);
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fill();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // D. Rounded Corner Connector 2 (Bottom-Left)
          ctx.beginPath();
          ctx.arc(-tL / 2 + tD, tW / 2 - tD, tD, 0.5 * Math.PI, Math.PI);
          ctx.lineTo(-tL / 2 + tD, tW / 2 - tD);
          ctx.closePath();
          ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
          ctx.fill();
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.restore();
        }

        ctx.restore();

        // 5. SEATS
        seats.forEach(seat => {
          const sX = seat.x * PXM;
          const sY = seat.y * PXM;
          const r = 11 * Math.min(zoom, 1.2);

          let fillColor = '#10b981';
          let strokeColor = '#059669';
          if (seat.status === 'ORANGE') {
            fillColor = '#f59e0b';
            strokeColor = '#d97706';
          } else if (seat.status === 'RED') {
            fillColor = '#f43f5e';
            strokeColor = '#e11d48';
          }

          ctx.beginPath();
          ctx.arc(sX, sY, r, 0, Math.PI * 2);
          ctx.fillStyle = fillColor;
          ctx.fill();
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(seat.id, sX, sY);
        });

        // 6. DEVICES
        devices.forEach(dev => {
          const devX = dev.offsetX * PXM;
          const devY = dev.offsetY * PXM;
          const devRadius = 13;

          ctx.beginPath();
          ctx.arc(devX, devY, devRadius, 0, Math.PI * 2);
          ctx.fillStyle = dev.type === 'frontBar' ? '#6366f1' : '#0284c7';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(devX, devY, 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = '600 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(dev.name, devX, devY + 22);
        });

        ctx.restore();
      }, [
        roomLength,
        roomWidth,
        tableShape,
        tableLength,
        tableWidth,
        tableDepth,
        tablePos,
        devices,
        seats,
        zoom,
        pan,
        showGrid,
        showVideoZone,
        showAudioZone
      ]);

      // MOUSE DRAG HANDLERS
      const handleMouseDown = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const centerX = rect.width / 2 + pan.x;
        const centerY = rect.height / 2 + pan.y;

        const worldX = (mouseX - centerX) / PXM;
        const worldY = (mouseY - centerY) / PXM;

        for (let dev of devices) {
          const dx = worldX - dev.offsetX;
          const dy = worldY - dev.offsetY;
          if (Math.sqrt(dx * dx + dy * dy) <= 0.6) {
            isDraggingRef.current = true;
            dragTargetRef.current = {
              type: 'device',
              id: dev.id,
              startMouse: { x: mouseX, y: mouseY },
              startPos: { x: dev.offsetX, y: dev.offsetY }
            };
            return;
          }
        }

        const dtX = worldX - tablePos.x;
        const dtY = worldY - tablePos.y;
        if (Math.abs(dtX) <= tableLength / 2 && Math.abs(dtY) <= tableWidth / 2) {
          isDraggingRef.current = true;
          dragTargetRef.current = {
            type: 'table',
            startMouse: { x: mouseX, y: mouseY },
            startPos: { ...tablePos }
          };
          return;
        }

        isDraggingRef.current = true;
        dragTargetRef.current = {
          type: 'canvas',
          startMouse: { x: mouseX, y: mouseY },
          startPan: { ...pan }
        };
      };

      const handleMouseMove = (e) => {
        if (!isDraggingRef.current || !dragTargetRef.current) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();

        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const deltaX = (mouseX - dragTargetRef.current.startMouse.x) / PXM;
        const deltaY = (mouseY - dragTargetRef.current.startMouse.y) / PXM;

        if (dragTargetRef.current.type === 'device') {
          const devId = dragTargetRef.current.id;
          const newX = dragTargetRef.current.startPos.x + deltaX;
          const newY = dragTargetRef.current.startPos.y + deltaY;

          setDevices(prev =>
            prev.map(d => (d.id === devId ? { ...d, offsetX: newX, offsetY: newY } : d))
          );
        } else if (dragTargetRef.current.type === 'table') {
          setTablePos({
            x: dragTargetRef.current.startPos.x + deltaX,
            y: dragTargetRef.current.startPos.y + deltaY
          });
        } else if (dragTargetRef.current.type === 'canvas') {
          const pxDeltaX = mouseX - dragTargetRef.current.startMouse.x;
          const pxDeltaY = mouseY - dragTargetRef.current.startMouse.y;
          setPan({
            x: dragTargetRef.current.startPan.x + pxDeltaX,
            y: dragTargetRef.current.startPan.y + pxDeltaY
          });
        }
      };

      const handleMouseUp = () => {
        isDraggingRef.current = false;
        dragTargetRef.current = null;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.08 : -0.08;
        setZoom(z => Math.max(0.3, Math.min(2.5, z + zoomDelta)));
      };

      return (
        <div className="flex-1 w-full h-full relative cursor-grab active:cursor-grabbing">
          <canvas
            id="av-canvas"
            ref={canvasRef}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onWheel={handleWheel}
            className="w-full h-full block"
          />
        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
