<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulateur Acoustique & Vidéo - Room Visualizer & AV Coverage</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (v18 UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }
    
    .canvas-container {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- PRESETS SYSTEM ---
    const PRESETS = [
      {
        id: 'owl3',
        name: 'Meeting Owl 3',
        category: '360° Center',
        description: 'Caméra et haut-parleur 360° tout-en-un pour salles de taille moyenne.',
        resolution: '1080p Full HD (360°)',
        daisyChain: 'Sans fil via Owl Connect (jusqu\'à 2 unités)',
        autonomyOS: 'Système autonome Owl Intelligence System (OIS)',
        devices: [
          { id: 'dev-1', name: 'Meeting Owl 3', type: 'center360', videoRadius: 3.0, audioRadius: 5.5, offsetX: 0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'dual_owl3',
        name: 'Dual Meeting Owl 3',
        category: '360° Dual',
        description: 'Deux unités Owl 3 appairées sans fil pour une extension de couverture.',
        resolution: '1080p Full HD (Chaque unité)',
        daisyChain: 'Appairage sans fil Owl Connect (portée max 8m entre unités)',
        autonomyOS: 'Commutation intelligente de caméra automatique',
        devices: [
          { id: 'dev-1', name: 'Owl 3 (Principal)', type: 'center360', videoRadius: 3.0, audioRadius: 5.5, offsetX: -2.0, offsetY: 0, fov: 360 },
          { id: 'dev-2', name: 'Owl 3 (Secondaire)', type: 'center360', videoRadius: 3.0, audioRadius: 5.5, offsetX: 2.0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'kandao_pro',
        name: 'Kandao Meeting Pro',
        category: '360° Center',
        description: 'Caméra 360° avec système Android intégré et haut-parleurs Hi-Fi.',
        resolution: '1080p (Enregistrement 4K)',
        daisyChain: 'Non supporté',
        autonomyOS: 'Android OS intégré (Mode Standalone ou USB PC)',
        devices: [
          { id: 'dev-1', name: 'Kandao Meeting Pro', type: 'center360', videoRadius: 3.2, audioRadius: 5.5, offsetX: 0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'kandao_ultra',
        name: 'Kandao Meeting Ultra',
        category: '360° Center',
        description: 'Caméra 360° premium avec deux écrans tactiles HD et vidéo 4K HDR.',
        resolution: '4K HDR 60fps (360°)',
        daisyChain: 'Chainable USB-C / IP',
        autonomyOS: 'Android OS autonome avec double écran tactile',
        devices: [
          { id: 'dev-1', name: 'Kandao Meeting Ultra', type: 'center360', videoRadius: 3.8, audioRadius: 5.5, offsetX: 0, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'dual_kandao',
        name: 'Dual Kandao Chaîné USB',
        category: '360° Dual',
        description: 'Deux boîtiers Kandao reliés par câble USB pour très grandes tables.',
        resolution: '4K HDR (Double vue)',
        daisyChain: 'Filaire USB-C Master/Slave',
        autonomyOS: 'Mode PC / BYOD via hub USB',
        devices: [
          { id: 'dev-1', name: 'Kandao Ultra (A)', type: 'center360', videoRadius: 3.8, audioRadius: 5.5, offsetX: -2.5, offsetY: 0, fov: 360 },
          { id: 'dev-2', name: 'Kandao Ultra (B)', type: 'center360', videoRadius: 3.8, audioRadius: 5.5, offsetX: 2.5, offsetY: 0, fov: 360 }
        ]
      },
      {
        id: 'logi_sight_rally',
        name: 'Logitech Sight + Rally Bar',
        category: 'Hybride Front + Center',
        description: 'Combinaison d\'une barre vidéo frontale et d\'une caméra de table multi-angles.',
        resolution: '4K Ultra-HD (Rally Bar) + 4K (Sight)',
        daisyChain: 'Connexion Directe IP / Ethernet à la Rally Bar',
        autonomyOS: 'CollabOS (Zoom Rooms, MS Teams Rooms, Mode BYOD)',
        devices: [
          { id: 'dev-1', name: 'Logitech Sight (Table)', type: 'center360', videoRadius: 2.3, audioRadius: 3.5, offsetX: 0, offsetY: 0, fov: 360 },
          { id: 'dev-2', name: 'Rally Bar (Mur Avant)', type: 'frontBar', videoRadius: 7.0, audioRadius: 7.0, offsetX: 0, offsetY: -3.8, fov: 120, angle: 90 }
        ]
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Room Settings State
      const [roomLength, setRoomLength] = useState(13);
      const [roomWidth, setRoomWidth] = useState(9);
      const [acousticTreatment, setAcousticTreatment] = useState('reverberant');

      // Table Settings State
      const [tableShape, setTableShape] = useState('U_SHAPE');
      const [tableLength, setTableLength] = useState(6.4);
      const [tableWidth, setTableWidth] = useState(4.6);
      const [tableDepth, setTableDepth] = useState(0.8);
      const [seatCount, setSeatCount] = useState(18);
      const [tablePos, setTablePos] = useState({ x: 0, y: 0 });

      // Equipment State
      const [selectedPresetId, setSelectedPresetId] = useState('owl3');
      const [activeDevices, setActiveDevices] = useState(PRESETS[0].devices);
      const [customPresets, setCustomPresets] = useState([]);
      const [showCustomModal, setShowCustomModal] = useState(false);

      // Canvas Interaction State
      const [zoom, setZoom] = useState(0.7);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [showGrid, setShowGrid] = useState(true);
      const [showVideoZone, setShowVideoZone] = useState(true);
      const [showAudioZone, setShowAudioZone] = useState(true);

      // Active Sidebar tab
      const [activeTab, setActiveTab] = useState('room');

      // Acoustic multiplier (reverberant room = -20% effective audio range)
      const acousticFactor = acousticTreatment === 'reverberant' ? 0.8 : 1.0;

      // Handle Preset Change
      const handleSelectPreset = (presetId) => {
        setSelectedPresetId(presetId);
        const preset = [...PRESETS, ...customPresets].find(p => p.id === presetId);
        if (preset) {
          setActiveDevices(preset.devices.map(d => ({ ...d })));
        }
      };

      // Add a custom device directly
      const handleAddCustomDevice = (newDev) => {
        setActiveDevices(prev => [...prev, { ...newDev, id: 'custom-' + Date.now() }]);
      };

      // Remove a device
      const handleRemoveDevice = (id) => {
        setActiveDevices(prev => prev.filter(d => d.id !== id));
      };

      // Save Current as Custom Preset
      const handleCreateCustomPreset = (customData) => {
        const newPreset = {
          id: 'custom-preset-' + Date.now(),
          name: customData.name,
          category: 'Personnalisé',
          description: customData.description || 'Configuration sur-mesure d\'équipements.',
          resolution: customData.resolution || 'Personnalisé',
          daisyChain: customData.daisyChain || 'Non spécifié',
          autonomyOS: customData.autonomyOS || 'Configuration personnalisée',
          devices: customData.devices
        };
        setCustomPresets(prev => [...prev, newPreset]);
        setSelectedPresetId(newPreset.id);
        setActiveDevices(newPreset.devices.map(d => ({ ...d })));
        setShowCustomModal(false);
      };

      // Reset Table & Cameras to Center
      const handleResetLayout = () => {
        setTablePos({ x: 0, y: 0 });
        const preset = [...PRESETS, ...customPresets].find(p => p.id === selectedPresetId);
        if (preset) {
          setActiveDevices(preset.devices.map(d => ({ ...d })));
        }
        setZoom(0.7);
        setPan({ x: 0, y: 0 });
      };

      // Calculate Seats Positions
      const seats = useMemo(() => {
        const list = [];
        const count = Math.max(2, seatCount);
        const halfL = tableLength / 2;
        const halfW = tableWidth / 2;
        const margin = 0.55;

        if (tableShape === 'RECTANGLE_SOLID' || tableShape === 'RECTANGLE_HOLLOW') {
          const perimeter = 2 * (tableLength + tableWidth);
          const step = perimeter / count;

          for (let i = 0; i < count; i++) {
            const dist = (i + 0.5) * step;
            let x = 0, y = 0;

            if (dist < tableLength) {
              x = -halfL + dist;
              y = -halfW - margin;
            } else if (dist < tableLength + tableWidth) {
              x = halfL + margin;
              y = -halfW + (dist - tableLength);
            } else if (dist < 2 * tableLength + tableWidth) {
              x = halfL - (dist - (tableLength + tableWidth));
              y = halfW + margin;
            } else {
              x = -halfL - margin;
              y = halfW - (dist - (2 * tableLength + tableWidth));
            }
            list.push({ id: i + 1, x: x + tablePos.x, y: y + tablePos.y });
          }
        } else if (tableShape === 'U_SHAPE') {
          // Rotated 90° U-Shape (horizontal along X axis)
          // Top horizontal leg: length tableLength (X: -halfL to +halfL, Y: -halfW)
          // Base vertical leg: length tableWidth (X: -halfL, Y: -halfW to +halfW)
          // Bottom horizontal leg: length tableLength (X: -halfL to +halfL, Y: +halfW)
          const topLen = tableLength;
          const baseLen = tableWidth;
          const bottomLen = tableLength;
          const totalPerim = topLen + baseLen + bottomLen;
          const step = totalPerim / count;

          for (let i = 0; i < count; i++) {
            const dist = (i + 0.5) * step;
            let x = 0, y = 0;

            if (dist < topLen) {
              // Top horizontal leg (outer top edge)
              x = -halfL + dist;
              y = -halfW - margin;
            } else if (dist < topLen + baseLen) {
              // Base vertical leg (outer left edge)
              x = -halfL - margin;
              y = -halfW + (dist - topLen);
            } else {
              // Bottom horizontal leg (outer bottom edge)
              x = -halfL + (dist - (topLen + baseLen));
              y = halfW + margin;
            }
            list.push({ id: i + 1, x: x + tablePos.x, y: y + tablePos.y });
          }
        } else if (tableShape === 'LINE') {
          const step = tableLength / count;
          for (let i = 0; i < count; i++) {
            const x = -halfL + (i + 0.5) * step;
            const y = tableDepth / 2 + margin;
            list.push({ id: i + 1, x: x + tablePos.x, y: y + tablePos.y });
          }
        }

        return list;
      }, [tableShape, tableLength, tableWidth, tableDepth, seatCount, tablePos]);

      // Calculate Seat Coverage Status
      const seatStatuses = useMemo(() => {
        return seats.map(seat => {
          let hasVideo = false;
          let hasAudio = false;
          let minDevDistVideo = Infinity;
          let minDevDistAudio = Infinity;

          activeDevices.forEach(dev => {
            const dx = seat.x - dev.offsetX;
            const dy = seat.y - dev.offsetY;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const effAudioRadius = dev.audioRadius * acousticFactor;

            if (dist <= effAudioRadius) {
              hasAudio = true;
            }
            if (dist < minDevDistAudio) minDevDistAudio = dist;

            if (dev.type === 'frontBar') {
              const devAngleRad = ((dev.angle || 90) * Math.PI) / 180;
              const angleToSeat = Math.atan2(dy, dx);
              let angleDiff = Math.abs(angleToSeat - devAngleRad);
              while (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
              angleDiff = Math.abs(angleDiff);

              const halfFovRad = (((dev.fov || 120) / 2) * Math.PI) / 180;

              if (dist <= dev.videoRadius && angleDiff <= halfFovRad) {
                hasVideo = true;
              }
            } else {
              if (dist <= dev.videoRadius) {
                hasVideo = true;
              }
            }
            if (dist < minDevDistVideo) minDevDistVideo = dist;
          });

          let status = 'RED';
          if (hasVideo && hasAudio) {
            status = 'GREEN';
          } else if (hasAudio) {
            status = 'ORANGE';
          }

          return {
            ...seat,
            status,
            minDevDistVideo,
            minDevDistAudio,
            hasVideo,
            hasAudio
          };
        });
      }, [seats, activeDevices, acousticFactor]);

      // Summary KPIs
      const kpis = useMemo(() => {
        const total = seatStatuses.length;
        const greenCount = seatStatuses.filter(s => s.status === 'GREEN').length;
        const orangeCount = seatStatuses.filter(s => s.status === 'ORANGE').length;
        const redCount = seatStatuses.filter(s => s.status === 'RED').length;
        return { total, greenCount, orangeCount, redCount };
      }, [seatStatuses]);

      // Dynamic framing & acoustic alerts calculation
      const alerts = useMemo(() => {
        const list = [];

        if (kpis.redCount > 0) {
          list.push({
            type: 'danger',
            title: 'Décrochage Audio / Vidéo',
            message: `${kpis.redCount} siège(s) sont hors portée.`,
            action: 'Recommandation : Rapprocher la table ou ajouter un second boîtier.'
          });
        }

        if (kpis.orangeCount > 0) {
          const farthestOrange = seatStatuses
            .filter(s => s.status === 'ORANGE')
            .reduce((max, s) => (s.minDevDistVideo > max ? s.minDevDistVideo : max), 0);
          
          const maxNominalVid = Math.max(...activeDevices.map(d => d.videoRadius), 3.0);

          list.push({
            type: 'warning',
            title: 'Risque de Pixellisation Vidéo',
            message: `${kpis.orangeCount} siège(s) sont au-delà de ${maxNominalVid.toFixed(1)} m (max : ${farthestOrange.toFixed(1)} m).`,
            action: 'Recommandation : Passer sur une configuration Dual.'
          });
        }

        if (acousticTreatment === 'reverberant') {
          list.push({
            type: 'info',
            title: 'Pièce Réverbérante',
            message: `Réduction de -20% appliquée sur le captage micro.`,
            action: 'Conseil : Poser des panneaux d\'absorption acoustique.'
          });
        }

        if (kpis.redCount === 0 && kpis.orangeCount === 0 && list.length === 0) {
          list.push({
            type: 'success',
            title: 'Couverture Optimale',
            message: `Tous les ${kpis.total} sièges bénéficient d'un captage audio et vidéo net.`,
            action: 'Implantation validée.'
          });
        }

        return list;
      }, [kpis, seatStatuses, activeDevices, acousticTreatment]);

      const selectedPreset = [...PRESETS, ...customPresets].find(p => p.id === selectedPresetId) || PRESETS[0];

      return (
        <div className="flex flex-col h-screen overflow-hidden bg-slate-950 text-slate-100 font-sans">
          
          {/* SOBRE TOP NAVBAR */}
          <header className="h-14 px-5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between z-20 flex-shrink-0">
            <div className="flex items-center space-x-3">
              <div className="w-8 h-8 rounded-lg bg-sky-600/20 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
              </div>
              <h1 className="text-sm font-semibold text-slate-200 tracking-wide">
                Room Visualizer & AV Coverage Simulator
              </h1>
            </div>

            {/* Preset Quick Selector */}
            <div className="flex items-center space-x-3">
              <span className="text-xs text-slate-400">Équipement :</span>
              <select
                value={selectedPresetId}
                onChange={(e) => handleSelectPreset(e.target.value)}
                className="pl-3 pr-8 py-1.5 text-xs font-medium rounded-lg bg-slate-800 border border-slate-700 text-slate-200 focus:outline-none focus:border-sky-500 cursor-pointer"
              >
                <optgroup label="Presets Constructeurs">
                  {PRESETS.map(p => (
                    <option key={p.id} value={p.id}>{p.name} ({p.category})</option>
                  ))}
                </optgroup>
                {customPresets.length > 0 && (
                  <optgroup label="Mes Presets Personnalisés">
                    {customPresets.map(p => (
                      <option key={p.id} value={p.id}>{p.name}</option>
                    ))}
                  </optgroup>
                )}
              </select>
            </div>
          </header>

          {/* MAIN WORKSPACE LAYOUT */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* LEFT SIDEBAR: CONTROLS */}
            <aside className="w-72 border-r border-slate-800/80 bg-slate-900/60 flex flex-col flex-shrink-0 z-10">
              
              {/* Tab Navigation */}
              <div className="flex border-b border-slate-800 bg-slate-950/40">
                <button
                  onClick={() => setActiveTab('room')}
                  className={`flex-1 py-2.5 text-xs font-medium border-b-2 text-center transition ${
                    activeTab === 'room'
                      ? 'border-sky-500 text-sky-400 bg-slate-900/80'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Salle & Table
                </button>
                <button
                  onClick={() => setActiveTab('equipment')}
                  className={`flex-1 py-2.5 text-xs font-medium border-b-2 text-center transition ${
                    activeTab === 'equipment'
                      ? 'border-sky-500 text-sky-400 bg-slate-900/80'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Matériel ({activeDevices.length})
                </button>
                <button
                  onClick={() => setActiveTab('presets')}
                  className={`flex-1 py-2.5 text-xs font-medium border-b-2 text-center transition ${
                    activeTab === 'presets'
                      ? 'border-sky-500 text-sky-400 bg-slate-900/80'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Presets
                </button>
              </div>

              {/* Sidebar Content */}
              <div className="flex-1 overflow-y-auto p-4 space-y-5">
                
                {/* TAB 1: ROOM & TABLE */}
                {activeTab === 'room' && (
                  <>
                    {/* A. ROOM PARAMETERS */}
                    <div className="space-y-3">
                      <h2 className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                        Dimensions & Acoustique
                      </h2>

                      <div>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-300">Longueur</span>
                          <span className="text-sky-400 font-semibold">{roomLength} m</span>
                        </div>
                        <input
                          type="range"
                          min="5"
                          max="25"
                          step="0.5"
                          value={roomLength}
                          onChange={(e) => setRoomLength(parseFloat(e.target.value))}
                          className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                        />
                      </div>

                      <div>
                        <div className="flex justify-between text-xs mb-1">
                          <span className="text-slate-300">Largeur</span>
                          <span className="text-sky-400 font-semibold">{roomWidth} m</span>
                        </div>
                        <input
                          type="range"
                          min="4"
                          max="18"
                          step="0.5"
                          value={roomWidth}
                          onChange={(e) => setRoomWidth(parseFloat(e.target.value))}
                          className="w-full h-1 bg-slate-700 rounded appearance-none cursor-pointer accent-sky-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs text-slate-300 mb-1">Traitement Acoustique</label>
                        <select
                          value={acousticTreatment}
                          onChange={(e) => setAcousticTreatment(e.target.value)}
                          className="w-full px-2.5 py-1.5 text-xs rounded bg-slate-800 border border-slate-700 text-slate-200 focus:outline-none focus:border-sky-500"
                        >
                          <option value="reverberant">Réverbérante (-20% portée audio)</option>
                          <option value="treated">Traitée acoustiquement (100%)</option>
                        </select>
                      </div>
                    </div>

                    <hr className="border-slate-800" />

                    {/* B. TABLE CONFIGURATION */}
                    <div className="space-y-3">
                      <h2 className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                        Configuration de la Table
                      </h2>

                      <div>
                        <label className="block text-xs text-slate-300 mb-1.5">Forme de table</label>
                        <div className="grid grid-cols-2 gap-1.5 text-xs">
                          <button
                            type="button"
                            onClick={() => setTableShape('U_SHAPE')}
                            className={`p-2 rounded border text-left transition ${
                              tableShape === 'U_SHAPE'
                                ? 'border-sky-500 bg-sky-950/30 text-sky-300 font-semibold'
                                : 'border-slate-800 hover:bg-slate-800/50 text-slate-400'
                            }`}
                          >
                            Table en U
                          </button>

                          <button
                            type="button"
                            onClick={() => setTableShape('RECTANGLE_HOLLOW')}
                            className={`p-2 rounded border text-left transition ${
                              tableShape === 'RECTANGLE_HOLLOW'
                                ? 'border-sky-500 bg-sky-950/30 text-sky-300 font-semibold'
                                : 'border-slate-800 hover:bg-slate-800/50 text-slate-400'
                            }`}
                          >
                            Conseil Fermé
                          </button>

                          <button
                            type="button"
                            onClick={() => setTableShape('RECTANGLE_SOLID')}
                            className={`p-2 rounded border text-left transition ${
                              tableShape === 'RECTANGLE_SOLID'
                                ? 'border-sky-500 bg-sky-950/30 text-sky-300 font-semibold'
                                : 'border-slate-800 hover:bg-slate-800/50 text-slate-400'
                            }`}
                          >
                            Rectangle Plein
                          </button>

                          <button
                            type="button"
                            onClick={() => setTableShape('LINE')}
                            className={`p-2 rounded border text-left transition ${
                              tableShape === 'LINE'
                                ? 'border-sky-500 bg-sky-950/30 text-sky-300 font-semibold'
                                : 'border-slate-800 hover:bg-slate-800/50 text-slate-400'
                            }`}
                          >
                            Ligne / Tribune
                          </button>
                        </div>
                      </div>

                      <div className="space-y-2.5">
                        <div>
                          <div className="flex justify-between text-xs mb-1">
                            <span className="text-slate-300">
                              {tableShape === 'U_SHAPE' ? 'Longueur Côtés' : 'Longueur Table'}
                            </span>
                            <span className="text-sky-400 font-semibold">{tableLength} m</span>
                          </div>
                          <input
                            type="range"
                            min="2"
                            max="15"

    // --- CANVAS 2D RENDER ENGINE COMPONENT ---
    function Canvas2DEngine({
      roomLength,
      roomWidth,
      tableShape,
      tableLength,
      tableWidth,
      tableDepth,
      tablePos,
      setTablePos,
      devices,
      setDevices,
      seats,
      zoom,
      setZoom,
      pan,
      setPan,
      showGrid,
      showVideoZone,
      showAudioZone,
      acousticFactor
    }) {
      const canvasRef = useRef(null);
      const isDraggingRef = useRef(false);
      const dragTargetRef = useRef(null);

      const PXM = 50 * zoom;

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, 0, width, height);

        const centerX = width / 2 + pan.x;
        const centerY = height / 2 + pan.y;

        ctx.save();
        ctx.translate(centerX, centerY);

        // 1. METRIC GRID
        if (showGrid) {
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
          ctx.lineWidth = 1;

          const roomWpx = roomWidth * PXM;
          const roomLpx = roomLength * PXM;

          const startX = -roomLpx / 2;
          const endX = roomLpx / 2;
          const startY = -roomWpx / 2;
          const endY = roomWpx / 2;

          for (let x = startX; x <= endX; x += PXM) {
            ctx.beginPath();
            ctx.moveTo(x, startY);
            ctx.lineTo(x, endY);
            ctx.stroke();
          }

          for (let y = startY; y <= endY; y += PXM) {
            ctx.beginPath();
            ctx.moveTo(startX, y);
            ctx.lineTo(endX, y);
            ctx.stroke();
          }
        }

        // 2. ROOM WALLS
        const rW = roomLength * PXM;
        const rH = roomWidth * PXM;
        const roomLeft = -rW / 2;
        const roomTop = -rH / 2;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
        ctx.fillRect(roomLeft, roomTop, rW, rH);

        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.strokeRect(roomLeft, roomTop, rW, rH);

        // Room Length Annotation (Top)
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${roomLength} m`, 0, roomTop - 10);

        // Room Width Annotation (Left)
        ctx.save();
        ctx.translate(roomLeft - 14, 0);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(`${roomWidth} m`, 0, 0);
        ctx.restore();

        // 3. COVERAGE ZONES
        devices.forEach(dev => {
          const devX = dev.offsetX * PXM;
          const devY = dev.offsetY * PXM;

          if (showAudioZone) {
            const effAudioR = dev.audioRadius * acousticFactor * PXM;
            ctx.beginPath();
            ctx.arc(devX, devY, effAudioR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(245, 158, 11, 0.08)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          if (showVideoZone) {
            const videoR = dev.videoRadius * PXM;
            ctx.beginPath();

            if (dev.type === 'frontBar') {
              const angleRad = ((dev.angle || 90) * Math.PI) / 180;
              const halfFovRad = (((dev.fov || 120) / 2) * Math.PI) / 180;
              ctx.moveTo(devX, devY);
              ctx.arc(devX, devY, videoR, angleRad - halfFovRad, angleRad + halfFovRad);
              ctx.closePath();
            } else {
              ctx.arc(devX, devY, videoR, 0, Math.PI * 2);
            }

            ctx.fillStyle = 'rgba(14, 165, 233, 0.12)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        });

        // 4. TABLE GEOMETRY
        ctx.save();
        ctx.translate(tablePos.x * PXM, tablePos.y * PXM);

        const tL = tableLength * PXM;
        const tW = tableWidth * PXM;
        const tD = tableDepth * PXM;

        ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 1.5;

        if (tableShape === 'RECTANGLE_SOLID') {
          ctx.beginPath();
          ctx.rect(-tL / 2, -tW / 2, tL, tW);
          ctx.fill();
          ctx.stroke();
        } else if (tableShape === 'RECTANGLE_HOLLOW') {
          ctx.beginPath();
          ctx.rect(-tL / 2, -tW / 2, tL, tW);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#090d16';
          ctx.beginPath();
          ctx.rect(-tL / 2 + tD, -tW / 2 + tD, tL - 2 * tD, tW - 2 * tD);
          ctx.fill();
          ctx.stroke();
        } else if (tableShape === 'U_SHAPE') {
          // U-Shape Rotated 90° (Horizontal along length X)
          ctx.beginPath();
          // Top horizontal leg
          ctx.rect(-tL / 2, -tW / 2, tL, tD);
          // Bottom horizontal leg
          ctx.rect(-tL / 2, tW / 2 - tD, tL, tD);
          // Left vertical base leg
          ctx.rect(-tL / 2, -tW / 2, tD, tW);
          ctx.fill();
          ctx.stroke();
        } else if (tableShape === 'LINE') {
          ctx.beginPath();
          ctx.rect(-tL / 2, -tD / 2, tL, tD);
          ctx.fill();
          ctx.stroke();
        }

        ctx.restore();

        // 5. SEATS
        seats.forEach(seat => {
          const sX = seat.x * PXM;
          const sY = seat.y * PXM;
          const r = 11 * Math.min(zoom, 1.2);

          let fillColor = '#10b981';
          let strokeColor = '#059669';
          if (seat.status === 'ORANGE') {
            fillColor = '#f59e0b';
            strokeColor = '#d97706';
          } else if (seat.status === 'RED') {
            fillColor = '#f43f5e';
            strokeColor = '#e11d48';
          }

          ctx.beginPath();
          ctx.arc(sX, sY, r, 0, Math.PI * 2);
          ctx.fillStyle = fillColor;
          ctx.fill();
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 9px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(seat.id, sX, sY);
        });

        // 6. DEVICES
        devices.forEach(dev => {
          const devX = dev.offsetX * PXM;
          const devY = dev.offsetY * PXM;
          const devRadius = 13;

          ctx.beginPath();
          ctx.arc(devX, devY, devRadius, 0, Math.PI * 2);
          ctx.fillStyle = dev.type === 'frontBar' ? '#6366f1' : '#0284c7';
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(devX, devY, 3.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = '600 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(dev.name, devX, devY + 22);
        });

        ctx.restore();
      }, [
        roomLength,
        roomWidth,
        tableShape,
        tableLength,
        tableWidth,
        tableDepth,
        tablePos,
        devices,
        seats,
        zoom,
        pan,
        showGrid,
        showVideoZone,
        showAudioZone,
        acousticFactor
      ]);

      // MOUSE DRAG HANDLERS
      const handleMouseDown = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const centerX = rect.width / 2 + pan.x;
        const centerY = rect.height / 2 + pan.y;

        const worldX = (mouseX - centerX) / PXM;
        const worldY = (mouseY - centerY) / PXM;

        for (let dev of devices) {
          const dx = worldX - dev.offsetX;
          const dy = worldY - dev.offsetY;
          if (Math.sqrt(dx * dx + dy * dy) <= 0.6) {
            isDraggingRef.current = true;
            dragTargetRef.current = {
              type: 'device',
              id: dev.id,
              startMouse: { x: mouseX, y: mouseY },
              startPos: { x: dev.offsetX, y: dev.offsetY }
            };
            return;
          }
        }

        const dtX = worldX - tablePos.x;
        const dtY = worldY - tablePos.y;
        if (Math.abs(dtX) <= tableLength / 2 && Math.abs(dtY) <= tableWidth / 2) {
          isDraggingRef.current = true;
          dragTargetRef.current = {
            type: 'table',
            startMouse: { x: mouseX, y: mouseY },
            startPos: { ...tablePos }
          };
          return;
        }

        isDraggingRef.current = true;
        dragTargetRef.current = {
          type: 'canvas',
          startMouse: { x: mouseX, y: mouseY },
          startPan: { ...pan }
        };
      };

      const handleMouseMove = (e) => {
        if (!isDraggingRef.current || !dragTargetRef.current) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();

        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const deltaX = (mouseX - dragTargetRef.current.startMouse.x) / PXM;
        const deltaY = (mouseY - dragTargetRef.current.startMouse.y) / PXM;

        if (dragTargetRef.current.type === 'device') {
          const devId = dragTargetRef.current.id;
          const newX = dragTargetRef.current.startPos.x + deltaX;
          const newY = dragTargetRef.current.startPos.y + deltaY;

          setDevices(prev =>
            prev.map(d => (d.id === devId ? { ...d, offsetX: newX, offsetY: newY } : d))
          );
        } else if (dragTargetRef.current.type === 'table') {
          setTablePos({
            x: dragTargetRef.current.startPos.x + deltaX,
            y: dragTargetRef.current.startPos.y + deltaY
          });
        } else if (dragTargetRef.current.type === 'canvas') {
          const pxDeltaX = mouseX - dragTargetRef.current.startMouse.x;
          const pxDeltaY = mouseY - dragTargetRef.current.startMouse.y;
          setPan({
            x: dragTargetRef.current.startPan.x + pxDeltaX,
            y: dragTargetRef.current.startPan.y + pxDeltaY
          });
        }
      };

      const handleMouseUp = () => {
        isDraggingRef.current = false;
        dragTargetRef.current = null;
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY < 0 ? 0.08 : -0.08;
        setZoom(z => Math.max(0.3, Math.min(2.5, z + zoomDelta)));
      };

      return (
        <div className="flex-1 w-full h-full relative cursor-grab active:cursor-grabbing">
          <canvas
            id="av-canvas"
            ref={canvasRef}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onWheel={handleWheel}
            className="w-full h-full block"
          />
        </div>
      );
    }

    // --- MODAL COMPONENT: CREATE CUSTOM PRESET ---
    function CustomPresetModal({ onClose, onSave, currentDevices }) {
      const [name, setName] = useState('Mon Preset Sur-Mesure');
      const [description, setDescription] = useState('Configuration personnalisée.');
      const [resolution, setResolution] = useState('4K / Multi-Flux');
      const [daisyChain, setDaisyChain] = useState('Filaire USB-C');
      const [autonomyOS, setAutonomyOS] = useState('Mode BYOD / PC dédié');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          name,
          description,
          resolution,
          daisyChain,
          autonomyOS,
          devices: currentDevices.map(d => ({ ...d }))
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md shadow-2xl p-5 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
              <h3 className="text-xs font-bold text-white uppercase tracking-wider">
                Nouveau Preset Personnalisé
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-200">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block text-slate-300 font-medium mb-1">Nom du Preset</label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  className="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-slate-300 font-medium mb-1">Résolution</label>
                  <input
                    type="text"
                    value={resolution}
                    onChange={(e) => setResolution(e.target.value)}
                    className="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500"
                  />
                </div>

                <div>
                  <label className="block text-slate-300 font-medium mb-1">Mode Chaînage</label>
                  <input
                    type="text"
                    value={daisyChain}
                    onChange={(e) => setDaisyChain(e.target.value)}
                    className="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-300 font-medium mb-1">OS / Mode de Fonctionnement</label>
                <input
                  type="text"
                  value={autonomyOS}
                  onChange={(e) => setAutonomyOS(e.target.value)}
                  className="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-sky-500"
                />
              </div>

              <div className="flex justify-end space-x-2 pt-2 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-1.5 rounded text-slate-400 hover:bg-slate-800 transition"
                >
                  Annuler
                </button>
                <button
                  type="submit"
                  className="px-3 py-1.5 rounded bg-sky-600 hover:bg-sky-500 text-white font-medium transition"
                >
                  Enregistrer
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
